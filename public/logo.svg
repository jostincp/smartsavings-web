<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Piggy Body Gradient: Smart Blue to Savings Green -->
    <linearGradient id="bodyGrad" x1="20" y1="30" x2="140" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A96BC" />
      <stop offset="50%" stop-color="#6BA5C8" />
      <stop offset="100%" stop-color="#7FBDA3" />
    </linearGradient>
    
    <!-- Coin Gradient: Warm Gold -->
    <linearGradient id="coinGrad" x1="70" y1="10" x2="105" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#D4A574" />
    </linearGradient>

    <!-- Coin Glow -->
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEBD0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F5B041" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Highlight for 3D depth -->
    <linearGradient id="highlightGrad" x1="50" y1="40" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1B2E3C" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient Shadow below Piggy -->
  <ellipse cx="80" cy="144" rx="46" ry="7" fill="#1B2E3C" opacity="0.15" />

  <!-- The Golden Coin (Dropping into slot) -->
  <g>
    <!-- Coin outer edge with shadow -->
    <ellipse cx="88" cy="34" rx="20" ry="24" fill="url(#coinGrad)" filter="url(#softShadow)" />
    <!-- Coin inner rim -->
    <ellipse cx="88" cy="34" rx="16" ry="20" fill="none" stroke="#FFF3D1" stroke-width="2" opacity="0.8" />
    <!-- Dollar / Savings Symbol -->
    <text x="88" y="41" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="900" fill="#7D4E19" text-anchor="middle">$</text>
    <text x="88" y="40" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
    <!-- Coin Sparkle -->
    <path d="M72 20 L74 24 L78 26 L74 28 L72 32 L70 28 L66 26 L70 24 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Coin Slot Lip -->
  <path d="M74 48 C78 44, 98 44, 102 48 C98 52, 78 52, 74 48 Z" fill="#2C4A5E" />

  <!-- Piggy Main Body & Legs -->
  <g filter="url(#softShadow)">
    <path d="
      M 38 68
      C 30 76, 26 92, 28 108
      C 29 116, 32 122, 36 126
      L 38 138
      C 38 141, 44 142, 46 138
      L 50 128
      C 60 130, 72 130, 84 128
      L 88 138
      C 90 142, 96 141, 98 138
      L 100 126
      C 114 120, 126 108, 128 92
      C 130 84, 134 82, 138 82
      C 142 82, 144 86, 144 90
      C 144 94, 140 98, 138 98
      C 134 98, 132 102, 130 106
      C 126 114, 118 122, 110 126
      C 122 112, 128 94, 124 76
      C 120 58, 106 46, 88 46
      C 76 46, 60 50, 48 58
      C 42 52, 34 50, 32 54
      C 30 58, 34 64, 38 68
      Z
    " fill="url(#bodyGrad)" />

    <!-- Cute Curled Tail -->
    <path d="M 28 94 C 20 90, 16 96, 20 100 C 24 104, 28 98, 22 96" fill="none" stroke="#5A96BC" stroke-width="4" stroke-linecap="round" />

    <!-- Cute Snout -->
    <ellipse cx="126" cy="88" rx="14" ry="11" fill="#7FBDA3" />
    <ellipse cx="126" cy="88" rx="14" ry="11" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
    <!-- Nostrils -->
    <ellipse cx="123" cy="88" rx="2.2" ry="3.5" fill="#2C4A5E" opacity="0.75" />
    <ellipse cx="129" cy="88" rx="2.2" ry="3.5" fill="#2C4A5E" opacity="0.75" />

    <!-- Cute Friendly Eye -->
    <circle cx="104" cy="74" r="5.5" fill="#1B2E3C" />
    <circle cx="106" cy="72" r="2" fill="#FFFFFF" />
    <circle cx="103" cy="76" r="1" fill="#FFFFFF" opacity="0.8" />

    <!-- Cute Ear -->
    <path d="M 88 48 C 88 38, 98 38, 102 46 C 104 50, 96 52, 88 48 Z" fill="#6BA5C8" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />

    <!-- Belly Accent (Savings Green curve) -->
    <path d="M 38 104 C 54 116, 76 118, 102 108 C 88 126, 56 124, 38 104 Z" fill="#7FBDA3" opacity="0.6" />

    <!-- 3D Light Specular Curves -->
    <path d="M 52 64 C 70 54, 90 54, 104 62 C 90 58, 68 58, 52 64 Z" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>
